# Runs the tests and the Google style checks on every push and pull request.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    name: Tests and Google Python Style Guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest
      - run: pylint skills tests
      - run: yapf --diff --recursive skills tests
